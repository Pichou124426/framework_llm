# Neo4j for RAG Security Meta-Model
# Usage: docker compose up -d
# Browser: http://localhost:17474
# Credentials: neo4j / ragmeta1

services:
  neo4j:
    image: neo4j:5.15.0
    container_name: rag-security-neo4j
    ports:
      - "17474:7474" # HTTP Browser
      - "17687:7687" # Bolt protocol
    environment:
      - NEO4J_AUTH=neo4j/ragmeta1
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_server_bolt_advertised__address=localhost:17687
      - NEO4J_server_http_advertised__address=localhost:17474
      - NEO4J_server_memory_heap_initial__size=512m
      - NEO4J_server_memory_heap_max__size=1G
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:7474" ]
      interval: 10s
      timeout: 5s
      retries: 5

  neodash:
    image: nielsdejong/neodash:latest
    container_name: rag-neodash
    ports:
      - "5005:5005" # Neodash Port
    restart: unless-stopped

volumes:
  neo4j_data:
  neo4j_logs: